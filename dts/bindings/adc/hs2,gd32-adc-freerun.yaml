description: |
  GD32H7 free-running 3-ADC analog front-end. Owns three ADC instances
  (referenced via the adcs phandles, which should themselves be disabled so
  the standard gd,gd32-adc driver does not also claim them) and runs each in
  scan + continuous mode with a cyclic DMA stream. Exposes a latest-frame
  snapshot read instead of the Zephyr ADC request/response API.

compatible: "hs2,gd32-adc-freerun"

include: [base.yaml, pinctrl-device.yaml]

properties:
  adcs:
    type: phandles
    required: true
    description: ADC0, ADC1, ADC2 nodes (reg/clocks/resets are read from them).

  dmas:
    type: phandle-array
    required: true
    description: DMA spec for adc0, adc1, adc2 (via dmamux).

  dma-names:
    type: string-array
    required: true

  adc0-channels:
    type: array
    required: true
    description: 2 channel numbers on ADC0 (LX, LY).

  adc1-channels:
    type: array
    required: true
    description: 2 channel numbers on ADC1 (RX, RY).

  adc2-channels:
    type: array
    required: true
    description: 2 channel numbers on ADC2 (L2, R2).

  resolutions:
    type: array
    required: true
    description: per-ADC resolution in adcs order (e.g. <14 14 12>; ADC2 max 12).

  frames:
    type: int
    default: 4
    description: ring depth in frames (one frame = 2 ranks).
