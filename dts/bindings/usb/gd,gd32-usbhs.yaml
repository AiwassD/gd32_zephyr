description: |
  GigaDevice GD32 USBHS controller (Synopsys DWC2 IP with embedded HS PHY).

  Bound by the generic Zephyr DWC2 UDC driver via the "snps,dwc2" compatible.
  The "gd,gd32-usbhs" compatible is reserved to select the GD32 vendor quirks
  glue (clock / USB PLL / PHY regulator) once that glue is implemented.

compatible: "gd,gd32-usbhs"

include:
  - snps,dwc2.yaml

properties:
  clocks:
    type: phandle-array
    required: true

  ghwcfg3:
    type: int
    description: |
      Value of the GHWCFG3 register. The GD32 USBHS core does not expose the
      GHWCFG hardware-configuration registers (they read back as zero), so the
      driver falls back to the devicetree ghwcfg1/2/3/4 values. GHWCFG3 carries
      the device FIFO depth (DFIFODEPTH) and the packet/transfer counter widths.
